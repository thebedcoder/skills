[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-brain"
version = "0.1.0"
description = "Cross-repo memory and planning layer over a ticket-keyed code index."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "product-brain authors" }]
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
product-brain = "product_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"product_brain" = ["templates/*.md", "schemas/*.json"]
