# Product Brain orchestrator config.
# This file lives at the root of your central brain repo (e.g. company-product-brain/).
#
# Brain repo layout:
#   company-product-brain/
#     config.yaml                <- this file
#     repos/
#       flutter/{manifest.md, tickets/}
#       react/{manifest.md, tickets/}
#       backend/{manifest.md, tickets/}
#
# Source repos are NEVER modified — index data lives only in this brain repo.
# `path` in each entry below points at the source git repo (used for git log,
# diffs, citation validation). Resolved relative to this config file.

repos:
  - { name: flutter, path: ../flutter-app }
  - { name: react,   path: ../react-app }
  - { name: backend, path: ../backend }

# Ticket ID regex used everywhere (commit message parsing, comment commands, etc).
# Default matches things like AHA-1234. Override per-repo via manifest.md if needed.
ticket_regex: 'AHA-\d+'

# Which PM adapter to use. Must match a class registered in adapters/.
pm_adapter: aha

aha:
  subdomain: yourcompany           # https://<subdomain>.aha.io
  api_key_env: AHA_API_KEY         # env var holding the API token
  workspace: ""                    # optional workspace ID; empty = default

# Optional test-management adapter. Set null/omit to skip TestRail features
# (qa_edges, stability_signals, coverage_gaps). Cases must reference ticket
# IDs in the configured `refs_field` for per-ticket lookup to work.
test_adapter: testrail             # testrail | null (zephyr/xray pluggable)
testrail:
  base_url: https://yourco.testrail.io
  user_email: bot@yourcompany.com
  api_key_env: TESTRAIL_API_KEY
  project_id: 7
  refs_field: refs                 # custom field on cases holding ticket IDs
  run_history_window_days: 90      # window for stability signals + recent failures

# GitHub access for PR enrichment. Token needs `repo:read` scope on configured repos.
github:
  api_key_env: GITHUB_TOKEN

llm:
  # provider: anthropic | openai | azure_openai | openai_compatible
  # See docs/integrations.md for backend-specific examples (Copilot/Azure,
  # local models via Ollama/LM Studio/vLLM, OpenRouter/Groq/Together, etc).
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY
  # base_url: omit for hosted Anthropic/OpenAI; set for openai_compatible
  #           (e.g. http://localhost:11434/v1 for Ollama) or Azure endpoint.
  # base_url: http://localhost:11434/v1
  # api_version: 2024-02-15-preview      # Azure OpenAI only
  model_summarize:  claude-haiku-4-5-20251001     # cheap, used for backfill/incremental prose
  model_extract:    claude-haiku-4-5-20251001     # edge-case extraction (JSON-strict)
  model_synthesize: claude-sonnet-4-6             # final groom output (interactive + bot)
  max_input_tokens_per_ticket: 8000

# --- alternative llm: blocks (commented examples) ---
#
# OpenAI direct:
#   provider: openai
#   api_key_env: OPENAI_API_KEY
#   model_summarize:  gpt-4o-mini
#   model_extract:    gpt-4o-mini
#   model_synthesize: gpt-4o
#
# Azure OpenAI (most enterprise Copilot orgs):
#   provider: azure_openai
#   api_key_env: AZURE_OPENAI_API_KEY
#   base_url: https://yourco.openai.azure.com
#   api_version: 2024-02-15-preview
#   model_summarize:  gpt-4o-mini-deployment      # your Azure deployment names
#   model_extract:    gpt-4o-mini-deployment
#   model_synthesize: gpt-4o-deployment
#
# Local models via Ollama (or LM Studio / vLLM / llama.cpp):
#   provider: openai_compatible
#   api_key_env: OPENAI_API_KEY                   # any value works; Ollama ignores it
#   base_url: http://localhost:11434/v1
#   model_summarize:  llama3.1:8b-instruct
#   model_extract:    llama3.1:8b-instruct        # 7B-8B often fail strict JSON; see docs
#   model_synthesize: llama3.1:70b-instruct
#
# Hybrid (recommended for local): synthesize locally, mine on hosted (JSON discipline):
#   provider: openai_compatible
#   base_url: http://localhost:11434/v1
#   model_summarize:  llama3.1:70b-instruct
#   model_synthesize: llama3.1:70b-instruct
#   model_extract:    gpt-4o-mini    # NOTE: requires switching providers; not yet supported
#                                    # per-task. Use anthropic/openai for now and accept
#                                    # the cost; track in roadmap.

estimate:
  unit: days
  reference_window_days: 90
  min_similarity: 0.4
  min_references_for_medium: 4
  min_references_for_high: 6

backfill:
  workflow: squash                 # squash | merge | rebase
  pr_enrichment: true              # fetch PR review threads (recommended)
  symbol_extraction: false         # diff hunk header parsing; off by default

# Bot config — see docs/bot.md
bot:
  enabled: false                   # start manual-only; flip after a month of dogfooding
  host: 0.0.0.0
  port: 8088
  webhook_signing_secret_env: AHA_WEBHOOK_SECRET
  allowed_users:                   # who can issue /brain commands in Aha comments
    - pm@example.com
    - lead@example.com
  cooldown_hours: 24               # min hours between auto-runs on the same ticket
  opt_in_label: brain:on           # ticket must carry this label for auto-triggers
  kill_switch_label: brain:off
  quiet_hours_utc: [22, 7]         # [start_hour, end_hour] for auto-posts; manual bypasses
  draft_status: "Bot-draft"        # status used when bot creates draft sub-tickets

# Audit log location. Used by both CLI and bot. Append-only.
audit:
  path: ./audit.sqlite

# Job queue for the bot worker. SQLite is fine until ~100s of jobs/day.
queue:
  backend: sqlite
  path: ./queue.sqlite
